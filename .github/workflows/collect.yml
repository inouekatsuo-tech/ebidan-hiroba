name: 公式情報の収集

on:
  schedule:
    - cron: '7,37 * * * *'   # 30分ごと（毎時7分・37分）
  workflow_dispatch:          # GitHubの画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: EBiDAN公式サイトから集める
        run: node collector/collect.mjs
      - name: 公式Xの新着を集める（1時間に1回・X_BEARER_TOKEN があるときだけ）
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          # 定期実行のうち毎時1回だけ動かす（手動実行のときは毎回動かす）
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(date -u +%M)" -ge 30 ]; then
            echo "この回はXの取得を行いません（1時間に1回）"; exit 0
          fi
          node collector/collect-x.mjs

      - name: Xで話題のファン投稿を拾う（1日1回・JST 22時ごろ）
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_BUDGET: '5'
          FAN_MAX: '40'
          FAN_MIN_LIKES: '10'
          EVENT: ${{ github.event_name }}
        run: |
          H=$(date -u +%H)
          # 1日1回（日本時間の22時ごろ）※費用を抑えるため
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$H" != "13" ]; then
            echo "この回は話題の投稿を取得しません（1日1回）"; exit 0
          fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(date -u +%M)" -ge 30 ]; then
            echo "この回は話題の投稿を取得しません（毎時1回）"; exit 0
          fi
          node collector/collect-fan.mjs

      - name: 通知を送る（鍵があるときだけ）
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-audit --no-fund --silent
          node collector/push-send.mjs

      - name: 変化があればコミット（Vercelが自動でサイトを更新）
        run: |
          # Vercel(Hobby)はリポジトリ所有者のコミットだけをデプロイするので、所有者名義でコミットする
          git config user.name "inouekatsuo-tech"
          git config user.email "260111723+inouekatsuo-tech@users.noreply.github.com"
          git add milkies-hiroba/data collector/x-state.json collector/push-state.json collector/collect-health.json
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          git commit -m "data: 公式情報を更新（自動収集）"
          git push
