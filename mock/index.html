<title>えびだん広場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --sunk:#EEF0F8; --ink:#1C1F3A; --muted:#666B8C; --line:#E1E4F0;
  --accent:#D94873; --accent-soft:#FCE7EE; --accent-ink:#FFFFFF;
  --official:#4D5FE0; --official-soft:#E7EAFD;
  --warn:#A55F00; --warn-soft:#FFF1DC; --ok:#17855A; --ok-soft:#E0F4EA;
  --shadow:0 6px 24px rgba(28,31,58,.08);
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11121D; --surface:#1A1C2B; --sunk:#222537; --ink:#ECEDF8; --muted:#9A9EBD; --line:#2B2E45;
    --accent:#FF7C9E; --accent-soft:#3A1F2C; --accent-ink:#1A0D13;
    --official:#8F9BFF; --official-soft:#232849;
    --warn:#F2B25C; --warn-soft:#3A2B14; --ok:#5ED3A0; --ok-soft:#143126;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11121D; --surface:#1A1C2B; --sunk:#222537; --ink:#ECEDF8; --muted:#9A9EBD; --line:#2B2E45;
  --accent:#FF7C9E; --accent-soft:#3A1F2C; --accent-ink:#1A0D13;
  --official:#8F9BFF; --official-soft:#232849;
  --warn:#F2B25C; --warn-soft:#3A2B14; --ok:#5ED3A0; --ok-soft:#143126;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.35;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.logo small{font-family:var(--body);font-weight:500;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;letter-spacing:.08em}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;border:0;cursor:pointer}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:26px}
.demo-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px}

.hero{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hero h1{font-size:clamp(24px,6.4vw,32px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:14px}
.search{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:18px}
.sec-h .sub{font-size:12px;color:var(--muted)}
.more{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:0}
a.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:700;font-size:14.5px;line-height:1.5}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.chip.official{background:var(--official-soft);color:var(--official)}
.chip.fan{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

.day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.date{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding-top:2px}
.date b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.date span{font-size:11px;color:var(--muted)}
.date.today b{color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-direction:column;gap:2px}
.item .t{font-size:14px;font-weight:500}
.time{font-variant-numeric:tabular-nums}

.rank{font-family:var(--display);font-weight:700;font-size:20px;width:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rank.r1{color:var(--accent)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.compose{padding:14px;display:flex;flex-direction:column;gap:10px}
.compose h3{font-size:15px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:0}
.actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}

.feed{display:flex;flex-direction:column;gap:14px}
.pick{padding:14px;display:flex;flex-direction:column;gap:10px}
.by{display:flex;align-items:center;gap:8px;font-size:13px}
.by .mini{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.by .who{font-weight:700}
.note{margin:0;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted)}
.foot button,.foot a{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.foot .liked{color:var(--accent);font-weight:700}
.foot .push{margin-left:auto}

.embed{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.embed-h{display:flex;align-items:center;gap:8px;font-size:13px}
.pf{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:11px;flex:none}
.embed-h .acct{font-weight:700}
.embed-h .src{margin-left:auto;font-size:11px;color:var(--muted)}
.embed p{margin:0;font-size:14px}
.ph{aspect-ratio:16/10;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--sunk) 0 10px,var(--surface) 10px 20px);border:1px dashed var(--line);text-align:center;padding:12px}
.embed .open{font-size:12px;color:var(--official);text-decoration:none;font-weight:700}

.comments{display:flex;flex-direction:column}
.cm{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cm:first-child{border-top:0}
.cm .meta b{color:var(--ink)}
.cm p{margin:0;font-size:14px}
.notice{font-size:12px;color:var(--official);background:var(--official-soft);border-radius:10px;padding:8px 12px}

.back{align-self:flex-start;text-decoration:none;font-size:13px;color:var(--muted);font-weight:700}
.page-h{display:flex;flex-direction:column;gap:6px}
.page-h h1{font-size:22px}
.page-h p{margin:0;color:var(--muted);font-size:14px}

.res{padding:12px 14px;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .hd{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.res .no{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.res .nm{color:var(--ok);font-weight:700}
.res p{margin:4px 0 0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.anc{color:var(--official);font-weight:700}

.comm{padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.comm-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.comm-h h3{font-size:16px}
.comm p{margin:0;font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.offkai{padding:14px;display:flex;flex-direction:column;gap:8px}
.offkai h3{font-size:15.5px}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lock{font-size:12.5px;color:var(--warn)}

.safety{display:flex;flex-direction:column;gap:6px;padding:12px 14px;font-size:13px}
.safety b{font-family:var(--display)}
.safety ul{margin:0;padding-left:1.2em;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:10.5px;color:var(--muted);text-decoration:none;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

dialog{border:0;border-radius:20px;padding:0;width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,25,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:20px}
.dlg p{margin:0;font-size:13px;color:var(--muted)}
.providers{display:flex;flex-direction:column;gap:8px}
.prov{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;text-align:left}
.prov:hover{border-color:var(--ink)}
.prov .pf{width:26px;height:26px}
.x-close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg a{text-align:center;text-decoration:none;padding:7px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ctabs a{padding:8px 12px;text-decoration:none;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.ctabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.rules{margin:0;padding:12px 14px 12px 34px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.info{margin:0;padding:14px;display:grid;grid-template-columns:4.5em 1fr;gap:10px 12px;font-size:14.5px}
.info dt{color:var(--muted);font-size:13px;font-weight:700}
.info dd{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{border:0;padding:0;margin:0;gap:6px}
.radios legend{padding:0;margin-bottom:4px}
.radios label{font-weight:500;display:flex;gap:8px;align-items:flex-start}
.agree{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
.req{display:flex;gap:10px;align-items:center}
.req .main{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
a.offkai{text-decoration:none}
a.offkai:hover{border-color:var(--accent)}
.center{align-self:center}
a.btn{text-decoration:none;display:inline-block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 62% 56%);flex:none;margin-right:5px;vertical-align:middle}
.dot.all{background:conic-gradient(hsl(345 62% 56%),hsl(40 62% 56%),hsl(140 62% 56%),hsl(215 62% 56%),hsl(300 62% 56%),hsl(345 62% 56%))}
.gchip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.fchip .dot{margin-right:4px}
a.fchip{text-decoration:none;display:inline-flex;align-items:center}
.fchip.add{border-style:dashed;color:var(--muted)}
.chip.cat-media{background:#E6F0FF;color:#2358B8}.chip.cat-event{background:#FFE9E3;color:#B8421F}.chip.cat-goods{background:#FFF3D6;color:#8A5A00}.chip.cat-release{background:#EFE6FF;color:#6A3DC0}.chip.cat-other{background:var(--sunk);color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.cat-media{background:#1C2A45;color:#8DB4FF}:root:not([data-theme="light"]) .chip.cat-event{background:#3A221B;color:#FF9E80}:root:not([data-theme="light"]) .chip.cat-goods{background:#3A2E12;color:#F5C567}:root:not([data-theme="light"]) .chip.cat-release{background:#2B2140;color:#C2A6FF}}
:root[data-theme="dark"] .chip.cat-media{background:#1C2A45;color:#8DB4FF}:root[data-theme="dark"] .chip.cat-event{background:#3A221B;color:#FF9E80}:root[data-theme="dark"] .chip.cat-goods{background:#3A2E12;color:#F5C567}:root[data-theme="dark"] .chip.cat-release{background:#2B2140;color:#C2A6FF}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font:inherit}
button.more{font-size:13px;color:var(--accent);font-weight:700;align-self:flex-start}
.mx-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.mx{border-collapse:collapse;width:100%;min-width:340px;font-size:12.5px}
.mx th,.mx td{padding:4px 3px;text-align:center}
.mx thead th{padding-top:10px;font-size:11.5px}
.mx tbody th{text-align:left;padding-left:12px;white-space:nowrap;font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.mx tbody th a{text-decoration:none;display:inline-flex;align-items:center}
.mx tbody tr:last-child td,.mx tbody tr:last-child th{padding-bottom:10px}
.mx-h{background:none;border:0;cursor:pointer;font-weight:700;color:var(--muted);padding:2px 0;font-size:11px;white-space:nowrap;letter-spacing:-.02em}
.cell{width:100%;min-width:30px;height:32px;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:color-mix(in srgb,var(--accent) calc(var(--a)*55%),var(--sunk))}
.cell:disabled{cursor:default;color:var(--muted);background:transparent}
.cell:not(:disabled):hover{outline:2px solid var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ctabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;align-items:baseline}
.ctabs button[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.cnt{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg.mini{display:inline-flex;padding:3px;gap:2px}
.seg.mini button{border:0;background:none;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.oitem{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.oitem .t{font-weight:700;font-size:15px}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px;border-radius:16px;background:linear-gradient(135deg,hsl(var(--h) 70% 55% / .16),hsl(var(--h) 70% 55% / .04));border:1px solid hsl(var(--h) 50% 55% / .3)}
.follow-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700;cursor:pointer}
.fl input{margin:0 2px 0 0}
.live-note{font-size:12px;color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:8px 12px}
a.item{text-decoration:none}
a.oitem{text-decoration:none}
a.oitem:hover{border-color:var(--official)}
.src-link{font-size:12px;color:var(--official);font-weight:700}
.live-note,.update-note{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:9px 12px}
.update-note b,.live-note b{display:block;font-size:13px}
.update-note span:not(.pulse),.live-note span:not(.pulse){color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;margin-top:5px;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2.4s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}}
.reax{display:flex;gap:6px;margin-top:8px}
.rx{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;line-height:1.4}
.rx span{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rx:hover{border-color:var(--accent)}
.rx.on{background:var(--accent-soft);border-color:var(--accent)}
.rx.on span{color:var(--accent)}
.noti-list{display:flex;flex-direction:column;gap:6px}
.noti-list .fl{font-weight:500}
.live-row{align-items:center}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.live-row .join{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.inherit{background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:12px;display:flex;flex-direction:column}
.inherit b{font-size:12.5px}
.inherit span{color:var(--muted)}
.install-h{align-items:flex-start}
.app-icon{width:56px;height:56px;border-radius:14px;box-shadow:var(--shadow)}
.install-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;position:relative}
.install-banner img{width:40px;height:40px;border-radius:11px;flex:none}
.install-banner b{display:block;font-size:14.5px}
.install-banner span{font-size:12.5px;color:var(--muted)}
.install-banner .x{position:absolute;top:4px;right:8px;background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.step .art{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.step .art svg{width:32px;height:32px}
.step .num{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.step b{font-size:15px;line-height:1.5}
.step p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ok-box{border-color:var(--ok)}
.warn-box{border-color:var(--warn)}
.profile{padding:16px;display:flex;gap:14px;align-items:center}
.profile .avatar{width:52px;height:52px;font-size:20px}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .25s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}} }

function days(){
  // 日本のファン向けなので、閲覧者の端末の時刻ではなく日本時間で数える
  const out=[], base=new Date(Date.now()+9*3600e3);
  for(let i=0;i<7;i++){ const d=new Date(base.getTime()+i*86400e3); out.push({day:d.getUTCDate(),w:i===0?'今日':'日月火水木金土'[d.getUTCDay()]}); }
  return out;
}

// 出演情報から「実況スレ」を自動で立てる（情報 → 交流の入口）
function ensureLiveThreads(){
  const today=days()[0];
  let added=0;
  // 同じ出演情報（複数グループが一緒に出るイベントなど）はひとつのスレッドにまとめる
  const seen=new Map();
  OFFICIAL.filter(o=>o.sched&&o.sched.d===0&&(o.cat==='media'||o.cat==='event')).forEach(o=>{
    const key=o.t.replace(/^【[^】]+】/,'').trim(); // 【メンバー名】を外した番組名で重複判定
    if(seen.has(key)){ const e=seen.get(key); if(o.g&&!e.gs.includes(o.g)) e.gs.push(o.g); }
    else seen.set(key,{o,gs:o.g?[o.g]:[]});
  });
  const live=[...seen.values()].slice(0,6).map(({o,gs})=>({...o,id:'lt-'+o.t.replace(/^【[^】]+】/,'').replace(/\W/g,'').slice(0,18),gs,
    t:o.t.replace(/^【[^】]+】/,'')}));
  const todayIds=new Set(live.map(o=>o.id));
  // 昨日までの実況スレは、書き込みがなければ片づける
  const before=S.threads.length;
  S.threads=S.threads.filter(t=>!t.live||todayIds.has(t.id)||t.res.length>1);
  live.forEach(o=>{
    const id=o.id;
    if(S.threads.some(t=>t.id===id)) return;
    S.threads.unshift({id,g:o.gs.length===1?o.gs[0]:null,gs:o.gs,cat:'実況',live:true,title:`【実況】${o.t}`,srcUrl:o.url,when:`${today.day}日 ${o.sched.time||''}`.trim(),count:1,upd:'自動で作成',
      res:[{n:1,nm:'広場の運営',id:'system',t:`このスレッドは出演情報から自動で立ちました。\n見ながらの実況・感想をどうぞ！\n\n※放送前の内容（ネタバレ）は伏せてください\n※チケットの売買・譲渡、メンバーのプライベートの話は禁止です`}]});
    added++;
  });
  if(added||before!==S.threads.length) save();
  return added;
}

V.install=()=>{
  const done=isStandalone();
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  let body;
  if(done){
    body=`<div class="panel compose ok-box"><b>ホーム画面に追加できています🎉</b>

  } else if(inApp()){
    body=`<div class="panel compose warn-box"><b>このままでは追加できません</b>
      <p class="hint">LINEやInstagramの中のブラウザで開いています。右上か右下の「…」から<b>「${isIOS()?'Safari':'Chrome'}で開く」</b>を選んで、もう一度この画面を開いてください。</p></div>

    body=`<ol class="steps">

    body=`${installPrompt?`<div class="panel compose"><b>ワンタップで追加できます</b><div class="actions"><button class="btn" id="do-install">ホーム画面に追加</button></div></div>`:''}

  }
  return `<a class="back" href="#/home">← ホーム</a>
  <div class="page-h install-h"><img src="icon-192.png" alt="" class="app-icon" onerror="this.remove()">
    <h1>アプリとして使う</h1>

const notiSupported=()=>('Notification' in window)&&('serviceWorker' in navigator);
function notiState(){ return notiSupported()?Notification.permission:'unsupported'; }
async function askNoti(){
  if(!notiSupported()) return toast('この環境では通知を使えません');
  const p=await Notification.requestPermission();
  render();
  if(p==='granted'){ showLocalNoti('通知をオンにしました','推しの出演がある日は、実況スレが立ったらお知らせします'); toast('通知をオンにしました'); }
  else toast('通知はオフのままです');
}
async function showLocalNoti(title,body,url){
  try{
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'ebidan',data:{url:url||location.href}});
  }catch(e){ toast('通知を表示できませんでした'); }
}

function myEvents(){
  const out=[];
  S.comms.forEach(c=>c.events.forEach(e=>{ if(S.going.includes(c.id+':'+e.id)) out.push([c,e]); }));
  return out.sort((a,b)=>a[1].date.localeCompare(b[1].date));
}
function myCommsHTML(){
  const mine=S.comms.filter(c=>status(c));
  const evs=myEvents();
  return `<section class="sec"><div class="sec-h"><h2>参加中のコミュニティ</h2><span class="sub">${mine.length}件</span></div>
    ${mine.length?`<div class="panel rows">${mine.map(c=>`<a class="row" href="#/c/${c.id}"><div class="main"><span class="t">${esc(c.name)}</span><span class="meta">${STATUS_CHIP[status(c)]}${memberCount(c).toLocaleString()}人${c.reqs&&c.reqs.length?` · <b style="color:var(--accent)">参加申請 ${c.reqs.length}件</b>`:''}</span></div></a>`).join('')}</div>`:'<p class="hint">まだ参加していません。<a href="#/community">コミュニティをさがす</a></p>'}
  </section>
  <section class="sec"><div class="sec-h"><h2>参加予定のイベント</h2><span class="sub">${evs.length}件</span></div>
    ${evs.length?`<div class="panel rows">${evs.map(([c,e])=>`<a class="row" href="#/e/${c.id}/${e.id}"><div class="main"><span class="meta"><span class="time">${fmtDate(e.date,e.time)}</span></span><span class="t">${esc(e.t)}</span><span class="meta">${esc(c.name)} · ${esc(e.place)}</span></div></a>`).join('')}</div>`:'<p class="hint">参加予定のイベントはありません。</p>'}
  </section>`;
}
V.mycomm=()=>{

function canSeeDetail(c){ const st=status(c); return st==='admin'||st==='member'; }
function eventCard(c,e){
  const k=c.id+':'+e.id, g=S.going.includes(k), n=e.joined+(g?1:0);
  return `<a class="panel offkai" href="#/e/${c.id}/${e.id}">
    <span class="meta"><span class="chip ${e.target==='10代限定'?'fan':'official'}">${esc(e.target)}</span><span class="time">${fmtDate(e.date,e.time)}</span>${g?'<span class="chip ok">参加予定</span>':''}</span>
    <h3>${esc(e.t)}</h3>
    <span class="meta">📍 ${canSeeDetail(c)?esc(e.place):esc(e.area)+' 周辺'} · 主催 ${esc(e.host)}</span>
    <div class="bar"><i style="width:${Math.min(100,n/e.cap*100)}%"></i></div><span class="meta">${n} / ${e.cap}人${n>=e.cap?' · 満員':''}</span></a>`;
}
function joinArea(c){
  const st=status(c), blk=ageBlock(c);
  if(st==='admin') return `<span class="chip ok">あなたが管理人です</span>`;
  if(st==='member') return `<span class="chip ok">参加中</span><button class="btn sm ghost" id="leave" data-id="${c.id}">退会する</button>`;
  if(st==='pending') return `<span class="chip warn">申請中（管理人の承認待ち）</span><button class="btn sm ghost" id="cancel-req" data-id="${c.id}">申請を取り消す</button>`;
  if(blk) return `<button class="btn" disabled>参加する</button><span class="lock">${blk}</span>`;
  return `<button class="btn" id="join" data-id="${c.id}">${c.join==='承認制'?'参加を申請する':'参加する'}</button>`;
}
V.c=(id,tab='top')=>{

  const see=canSeeDetail(c), closed=c.join==='承認制'&&!see;
  const tabs=[['top','トップ'],['events',`イベント（${c.events.length}）`],['topics','トピック'],['members','メンバー']];
  const lockMsg=`<div class="panel compose"><p class="hint">🔒 このコミュニティは承認制です。中の書き込みは参加者だけが見られます。</p></div>`;
  let body='';
  if(tab==='top'){
    body=`<section class="sec"><div class="sec-h"><h2>コミュニティのルール</h2></div>
      <ol class="panel rules">${c.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></section>
      <section class="sec"><div class="sec-h"><h2>近日のイベント</h2><a class="more" href="#/c/${c.id}/events">すべて見る</a></div>
      ${c.events.slice(0,2).map(e=>eventCard(c,e)).join('')||'<p class="hint">予定されているイベントはありません。</p>'}</section>`;
  } else if(tab==='events'){

    const targets=c.only==='10代'||teen?['10代限定']:['18歳以上','10代限定'];
    body=`<div class="notice">未成年の安全のため、イベントは「10代限定」と「18歳以上」に分かれています。お店の名前など詳しい場所は、コミュニティの参加者にだけ表示されます。</div>
      ${see?`<button class="btn ghost" id="evform-toggle">${ui.evForm?'閉じる':'＋ イベントをつくる'}</button>`:`<p class="hint">イベントをつくる・参加するには、このコミュニティに参加してください。</p>`}
      ${see&&ui.evForm?`<form class="panel compose" id="evform" data-cid="${c.id}">
        <label class="lb">イベント名<input class="field" id="ev-title" placeholder="例：推しメンの情報交換会" required></label>
        <div class="two"><label class="lb">日付<input class="field" type="date" id="ev-date" value="2026-10-03" required></label><label class="lb">開始時間<input class="field" type="time" id="ev-time" value="14:00" required></label></div>
        <label class="lb">場所（お店の名前など）<input class="field" id="ev-place" placeholder="例：スタバ 八千代台店" required></label>
        <label class="lb">エリア（参加者以外にはここまで表示）<input class="field" id="ev-area" placeholder="例：千葉県八千代市" required></label>
        <div class="two"><label class="lb">参加上限<input class="field" type="number" id="ev-cap" min="2" max="50" value="10" required></label>
        <label class="lb">対象<select class="field" id="ev-target">${targets.map(t=>`<option>${t}</option>`).join('')}</select></label></div>
        <label class="lb">内容<textarea class="field" id="ev-desc" placeholder="どんなことをするか、持ち物、費用など"></textarea></label>
        <p class="err" id="ev-err" hidden></p>
        <div class="actions"><button class="btn">イベントを公開する</button></div></form>`:''}
      ${c.events.map(e=>eventCard(c,e)).join('')||'<p class="hint">予定されているイベントはありません。</p>'}`;
  } else if(tab==='topics'){
    body=closed?lockMsg:`<div class="panel rows">${c.topics.map(t=>`<div class="row"><div class="main"><span class="t">${esc(t.t)}</span><span class="meta">${t.n}件 · ${esc(t.upd)}</span></div></div>`).join('')}</div>
      ${see?'<button class="btn ghost" id="newtopic">＋ トピックを立てる</button>':''}`;
  } else if(tab==='members'){
    const staff=[[c.admin,'管理人'],...c.subs.map(s=>[s,'副管理人'])];
    body=closed?lockMsg:`<div class="panel rows">${staff.map(([n,r])=>`<div class="row"><span class="mini-av">${initial(n)}</span><div class="main"><span class="t">${esc(n)}</span><span class="meta"><span class="chip ok">${r}</span></span></div></div>`).join('')}
      ${c.sample.filter(m=>!staff.some(s=>s[0]===m[0])).map(m=>`<div class="row"><span class="mini-av">${initial(m[0])}</span><div class="main"><span class="t">${esc(m[0])}</span><span class="meta"><span class="chip">${m[1]}</span><span class="chip">${m[2]}</span></span></div></div>`).join('')}</div>
      <p class="hint">ほか ${Math.max(0,memberCount(c)-c.sample.length).toLocaleString()}人が参加しています。表示されるのは年代と都道府県までです。</p>`;

    <h1>${esc(c.name)}</h1><p>${esc(c.desc)}</p>
    <span class="meta">管理人 <b style="color:var(--ink)">${esc(c.admin)}</b>${c.subs.length?` · 副管理人 ${c.subs.map(esc).join('、')}`:''} · 開設 ${esc(c.created)}</span></div>
  <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">${joinArea(c)}</div>

V.e=(cid,eid)=>{
  const c=S.comms.find(x=>x.id===cid), e=c&&c.events.find(x=>x.id===eid); if(!e) return V.community();
  const k=cid+':'+eid, g=S.going.includes(k), n=e.joined+(g?1:0), see=canSeeDetail(c), isHost=S.user&&e.host===S.user.name;
  let act='';
  if(isHost) act='<span class="chip ok">あなたが主催者です</span>';
  else if(!S.user) act='<button class="btn" id="login-open2">ログインして参加する</button>';
  else if(!see) act=`<a class="btn" href="#/c/${c.id}">まずコミュニティに参加する</a>`;
  else if(e.target==='10代限定'&&S.user.age!=='10代') act='<button class="btn" disabled>参加する</button><span class="lock">このイベントは10代限定です</span>';
  else if(e.target==='18歳以上'&&S.user.age==='10代') act='<button class="btn" disabled>参加する</button><span class="lock">安全のため、10代の方は「10代限定」のイベントのみ参加できます</span>';
  else if(g) act=`<span class="chip ok">参加予定</span><button class="btn sm ghost" data-go="${k}">参加を取り消す</button>`;
  else if(n>=e.cap) act='<button class="btn" disabled>満員です</button>';
  else act=`<button class="btn" data-go="${k}">参加する</button>`;
  return `<a class="back" href="#/c/${c.id}/events">← ${esc(c.name)}のイベント</a>
  <div class="page-h"><span class="meta"><span class="chip ${e.target==='10代限定'?'fan':'official'}">${esc(e.target)}</span>${esc(c.name)}</span><h1>${esc(e.t)}</h1></div>
  <dl class="panel info">
    <dt>日時</dt><dd class="time">${fmtDate(e.date,e.time)}〜</dd>
    <dt>場所</dt><dd>${see?esc(e.place)+`<br><span class="meta">${esc(e.area)}</span>`:esc(e.area)+' 周辺<br><span class="lock">お店の名前は、コミュニティの参加者にだけ表示されます</span>'}</dd>
    <dt>参加者</dt><dd>${n} / ${e.cap}人<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,n/e.cap*100)}%"></i></div></dd>
    <dt>主催</dt><dd>${esc(e.host)}</dd>
  </dl>
  ${e.desc?`<div class="panel compose"><p class="note" style="white-space:pre-wrap">${esc(e.desc)}</p></div>`:''}
  <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">${act}</div>
  <div class="notice">知らない人と会うときは、明るい時間に人の多いお店で。困ったことがあれば、すぐに運営へ通報してください。</div>`;
};

  <p>${c.join==='承認制'?`このコミュニティは承認制です。管理人の${esc(c.admin)}さんが承認すると参加できます。`:'このコミュニティにはすぐ参加できます。'}</p>
  <ol class="rules" style="margin:0">${c.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>
  <label class="agree"><input type="checkbox" id="agree"> ルールを読みました。守って参加します</label>
  <div class="actions"><button class="btn ghost sm" id="join-cancel">やめる</button><button class="btn" id="join-confirm" data-id="${c.id}" disabled>${c.join==='承認制'?'申請する':'参加する'}</button></div>`;
  $('#login').showModal();
}
function confirmJoin(id){
  const c=S.comms.find(x=>x.id===id); $('#login').close();
  if(c.join==='承認制'){
    S.pending.push(id); save(); render(); toast('参加を申請しました。管理人の承認をお待ちください');
    setTimeout(()=>{ if(!S.pending.includes(id)) return; S.pending=S.pending.filter(x=>x!==id); S.joined.push(id); save(); render(); toast(`（デモ）「${c.name}」の管理人が参加を承認しました`); },4000);
  } else { S.joined.push(id); save(); render(); toast(`「${c.name}」に参加しました`); }
}
// 公式情報：GitHub Actions が30分ごとに集めた data/items.json を読む
let LIVE=null;
function fmtUpdated(iso){
  const d=new Date(iso), diff=Math.floor((Date.now()-d)/60000);
  const t=d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  return diff<60?`${t}（${diff<1?'たった今':diff+'分前'}）`:t;
}
function jstToday(){ const d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(a+'T00:00Z')-new Date(b+'T00:00Z'))/86400e3); }
function relDate(date,today){ const n=dayDiff(today,date); return n<=0?'今日':n===1?'昨日':n+'日前'; }
function toOfficial(items){
  const today=jstToday(), out=[];
  for(const it of items){
    const n=dayDiff(it.date,today);
    if(it.kind==='schedule'){
      if(n<0||n>6) continue;
      out.push({id:it.id,g:it.g,cat:it.cat,kind:'schedule',src:'official',via:'スケジュール · '+(it.label||'予定'),t:it.t,url:it.url,r:n+.5,ago:n===0?'今日':n===1?'明日':(n+'日後'),sched:{d:n,time:''}});
    } else {
      if(n<-14) continue;
      out.push({id:it.id,g:it.g,cat:it.cat,kind:it.kind,src:'official',via:it.kind==='video'?'公式動画':'公式ニュース',t:it.t,url:it.url,r:-n,ago:relDate(it.date,today)});
    }
  }
  return out;
}
async function loadLive(){
  try{
    const r=await fetch('data/items.json',{cache:'no-store'}); if(!r.ok) return;
    const d=await r.json(); if(!d.items||!d.items.length) return;
    LIVE=d; OFFICIAL=toOfficial(d.items);
    const added=ensureLiveThreads(); render();
    const lt=S.threads.find(t=>t.live);
    notifyNewLive(added, lt&&lt.title.replace('【実況】',''));
  }catch(e){}
}
function render(){
  const h=location.hash.replace(/^#\/?/,'')||'home';
  const [r,id,sub]=h.split('/');
  const view=V[r]?V[r](id,sub):V.home();
  $('#app').innerHTML=view;
  const tab={pick:'info',g:'home',install:'me',thread:'board',c:'community',e:'community',mycomm:'community',newcomm:'community'}[r]||r;
  document.querySelectorAll('.tab').forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#acct').innerHTML=S.user?`<a class="avatar" href="#/me" aria-label="マイページ" style="text-decoration:none">${initial(S.user.name)}</a>`:`<button class="btn sm" id="login-open">ログイン</button>`;
}
function go(){ render(); window.scrollTo(0,0); }
window.addEventListener('hashchange',go);

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  const d=t.dataset;
  if(t.id==='login-open'){ openLogin(); }
  else if(t.id==='login-cancel'){ $('#login').close(); }
  else if(d.prov){ profileStep(d.prov); }
  else if(d.rx){ if(!need()) return; toggleReax(d.rx); }
  else if(d.like){ if(!need()) return; const i=S.likes.indexOf(d.like); i<0?S.likes.push(d.like):S.likes.splice(i,1); save(); render(); }
  else if(d.mx){ const [g,c]=d.mx.split(':'); ui.ig=g||(ui.mxAll?'all':'follow'); ui.ic=c; ui.src='all'; ui.q=''; if(location.hash==='#/info') go(); else location.hash='#/info'; }
  else if(d.ig){ ui.ig=d.ig; render(); }
  else if(d.ic){ ui.ic=d.ic; render(); }
  else if(d.gc){ ui.gc=d.gc; render(); }
  else if(d.src){ ui.src=d.src; if(t.tagName==='A'){ ui.ig='follow'; ui.ic='all'; ui.q=''; } else render(); }
  else if(d.bg){ ui.bg=d.bg; if(t.tagName!=='A') render(); }
  else if(d.cg){ ui.cg=d.cg; if(t.tagName!=='A') render(); }
  else if(t.id==='mx-toggle'){ ui.mxAll=!ui.mxAll; render(); }
  else if(t.id==='pick-toggle'){ if(!ui.pickOpen&&!need()) return; ui.pickOpen=!ui.pickOpen; render(); }
  else if(/^follow-edit/.test(t.id)){ openFollow(); }
  else if(t.id==='follow-save'){ S.follow=[...document.querySelectorAll('.follow-list input:checked')].map(x=>x.value); save(); $('#login').close(); render(); toast('推しグループを保存しました'); }
  else if(t.id==='follow-one'){ const g=d.g, i=S.follow.indexOf(g); i<0?S.follow.push(g):S.follow.splice(i,1); save(); render(); toast(i<0?'推しグループに追加しました':'推しグループから外しました'); }
  else if(t.id==='clearq'){ e.preventDefault(); ui.q=''; render(); }
  else if(d.bc){ ui.boardCat=d.bc; render(); }
  else if(d.ck){ ui.commKind=d.ck; render(); }
  else if(t.id==='newthread-toggle'){ if(!ui.newThread&&!need()) return; ui.newThread=!ui.newThread; render(); }
  else if(t.id==='login-open2'){ openLogin(); }
  else if(t.id==='join'){ if(!need()) return; openJoin(d.id); }
  else if(t.id==='join-confirm'){ confirmJoin(d.id); }
  else if(t.id==='join-cancel'){ $('#login').close(); }
  else if(t.id==='leave'){ if(!confirm('このコミュニティを退会しますか？')) return; S.joined=S.joined.filter(x=>x!==d.id); S.going=S.going.filter(x=>!x.startsWith(d.id+':')); save(); render(); toast('退会しました'); }
  else if(t.id==='cancel-req'){ S.pending=S.pending.filter(x=>x!==d.id); save(); render(); toast('参加申請を取り消しました'); }
  else if(d.approve||d.decline){ const [cid,i]=(d.approve||d.decline).split(':'); const c=S.comms.find(x=>x.id===cid); const [r]=c.reqs.splice(+i,1); if(d.approve){ c.members++; c.sample.push(r); toast(`${r[0]}さんの参加を承認しました`); } else toast(`${r[0]}さんの申請を見送りました`); save(); render(); }
  else if(t.id==='evform-toggle'){ ui.evForm=!ui.evForm; render(); }
  else if(d.go){ if(!need()) return; const i=S.going.indexOf(d.go); i<0?S.going.push(d.go):S.going.splice(i,1); save(); render(); toast(i<0?'イベントに参加します！マイページの「参加予定」に追加しました':'参加を取り消しました'); }
  else if(t.id==='hide-install'){ e.preventDefault(); ui.hideInstall=true; try{localStorage.setItem('hide-install','1');}catch(err){} render(); }
  else if(t.id==='do-install'){ if(installPrompt){ installPrompt.prompt(); installPrompt=null; } }
  else if(t.id==='ask-noti'){ askNoti(); }
  else if(t.id==='test-noti'){ showLocalNoti('テスト通知','この形でお知らせが届きます 🥛'); }
  else if(t.id==='newtopic'){ toast('モックではトピック作成画面は省略しています'); }
  else if(t.id==='logout'){ S.user=null; save(); render(); toast('ログアウトしました'); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='agree'){ $('#join-confirm').disabled=!e.target.checked; return; }
  if(e.target.dataset.noti){ S.noti[e.target.dataset.noti]=e.target.checked; save(); toast('通知の設定を保存しました'); return; }
  if(e.target.id==='me-age'){ S.user.age=e.target.value; save(); render(); toast(`年代を「${S.user.age}」に切り替えました`); }
});
document.addEventListener('input',e=>{ if(e.target.id==='comm-q'){ ui.cq=e.target.value; $('#comm-grid').innerHTML=commGrid(); } });
function showErr(sel,msg){ const el=$(sel); el.textContent=msg; el.hidden=false; }
function detect(u){
  let h; try{ h=new URL(u).hostname.replace(/^www\./,''); }catch(e){ return null; }
  if(/^(x|twitter|mobile\.twitter)\.com$/.test(h)) return 'X';
  if(/threads\.(net|com)$/.test(h)) return 'Threads';
  if(/instagram\.com$/.test(h)) return 'Instagram';
  if(/(youtube\.com|youtu\.be)$/.test(h)) return 'YouTube';
  if(/tiktok\.com$/.test(h)) return 'TikTok';
  return null;
}
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='search'){ ui.q=$('#q').value.trim(); ui.ig='all'; ui.ic='all'; ui.src='all'; location.hash='#/info'; }
  else if(f.id==='profform'){
    const nm=$('#pf-name').value.trim();
    if(nm.length<2||nm.length>12) return showErr('#pf-err','ハンドルネームは2〜12文字で入れてください');
    if(/^(管理人|運営|公式|admin)$/i.test(nm)) return showErr('#pf-err','その名前は使えません');
    S.user={name:nm,age:$('#pf-age').value,pref:$('#pf-pref').value,oshi:$('#pf-oshi').value,via:f.dataset.via};
    save(); $('#login').close(); toast(`ようこそ、${S.user.name}さん`);
    if(!isStandalone()){ location.hash='#/install'; } else { render(); }
  }
  else if(f.id==='pickform'){
    if(!need()) return;
    const url=$('#pick-url').value.trim(), note=$('#pick-note').value.trim(), pf=detect(url);
    if(!pf) return showErr('#pick-err','X・Threads・Instagram・YouTube・TikTokの投稿URLを貼ってください');
    const bad=ng(note); if(bad) return showErr('#pick-err',bad);
    const dup=S.picks.find(p=>p.url.replace(/[?#].*$/,'')===url.replace(/[?#].*$/,''));
    if(dup&&dup.url.length>25){ dup.shares++; save(); location.hash='#/pick/'+dup.id; toast('すでに持ち寄られていた投稿です。持ち寄った人数に+1しました'); return; }
    const acct=(url.match(/\.com\/@?([^/?#]+)/)||[])[1];
    S.picks.unshift({id:'p'+Date.now(),g:$('#pick-g').value,cat:$('#pick-c').value,r:-1,pf,acct:acct?'@'+acct:pf+'の投稿',text:'',img:false,by:S.user.name,note,tags:[],likes:0,shares:1,ago:'たった今',url,comments:[]});
    ui.pickOpen=false; ui.src='all'; save(); render(); toast('持ち寄りました！');
  }
  else if(f.id==='cmform'){
    if(!need()) return;
    const tx=$('#cm-text').value.trim(); if(!tx) return;
    const bad=ng(tx); if(bad) return showErr('#cm-err',bad);
    S.picks.find(p=>p.id===f.dataset.id).comments.push({by:S.user.name,t:tx,ago:'たった今'}); save(); render();
  }
  else if(f.id==='resform'){
    if(!need()) return;
    const tx=$('#res-text').value.trim(); if(!tx) return;
    const bad=ng(tx); if(bad) return showErr('#res-err',bad);
    const t=S.threads.find(x=>x.id===f.dataset.id);
    const n=Math.max(t.count,t.res.length)+1;
    t.res.push({n,nm:S.user.name,id:Math.random().toString(36).slice(2,7),t:tx}); t.count=n; t.upd='たった今'; save(); render();
  }
  else if(f.id==='comm-search'){ }
  else if(f.id==='evform'){
    const g=x=>$(x).value.trim();
    const ev={id:'e'+Date.now(),t:g('#ev-title'),date:g('#ev-date'),time:g('#ev-time'),place:g('#ev-place'),area:g('#ev-area'),cap:Math.max(2,Math.min(50,+g('#ev-cap')||10)),joined:0,target:g('#ev-target'),host:S.user.name,desc:g('#ev-desc')};
    if(!ev.t||!ev.date||!ev.place||!ev.area) return showErr('#ev-err','イベント名・日付・場所・エリアを入れてください');
    const bad=ng(ev.t+ev.desc); if(bad) return showErr('#ev-err',bad);
    const c=S.comms.find(x=>x.id===f.dataset.cid); c.events.push(ev); c.events.sort((a,b)=>a.date.localeCompare(b.date));
    S.going.push(c.id+':'+ev.id); ui.evForm=false; save(); location.hash=`#/e/${c.id}/${ev.id}`; toast('イベントを公開しました');
  }
  else if(f.id==='commform'){
    const name=$('#cm-name').value.trim(), desc=$('#cm-desc').value.trim();
    if(!name) return showErr('#cm-err','コミュニティ名を入れてください');
    const bad=ng(name+desc); if(bad) return showErr('#cm-err',bad);
    const only={'10代のみ':'10代','18歳以上のみ':'18歳以上'}[$('#cm-only').value]||null;
    const join=f.querySelector('[name="cm-join"]:checked').value;
    const a=only==='10代'?['10代','10代']:only?['20代','30代']:['10代','40代'];
    const now=new Date();
    const c={id:'c'+Date.now(),mine:true,g:$('#cm-g').value||null,name,kind:$('#cm-kind').value,members:1,only,join,admin:S.user.name,subs:[],created:`${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`,
      desc:desc||'（説明はまだありません）',rules:$('#cm-rules').value.split('\n').map(x=>x.trim()).filter(Boolean),topics:[{t:'自己紹介トピック',n:0,upd:'—'}],events:[],
      sample:[[S.user.name,S.user.age,S.user.pref]],reqs:join==='承認制'?[['ゆずみるく',a[0],'東京都'],['いちごみるく',a[1],'千葉県']]:[]};
    S.comms.unshift(c); save(); location.hash='#/c/'+c.id; toast(join==='承認制'?'コミュニティをつくりました。デモ用に参加申請が2件届いています':'コミュニティをつくりました');
  }
  else if(f.id==='threadform'){
    const title=$('#th-title').value.trim(), body=$('#th-body').value.trim();
    if(!title||!body) return showErr('#th-err','タイトルと最初の書き込みを入れてください');
    const bad=ng(title+body); if(bad) return showErr('#th-err',bad);
    const id='t'+Date.now();
    S.threads.unshift({id,g:$('#th-g').value||null,cat:$('#th-cat').value,title,count:1,upd:'たった今',res:[{n:1,nm:S.user.name,id:Math.random().toString(36).slice(2,7),t:body}]});
    ui.newThread=false; save(); location.hash='#/thread/'+id;
  }
});
render();
loadLive();
// ホーム画面アプリとして動かすための登録（マニフェストがあるときだけ）
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
