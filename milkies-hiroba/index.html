}

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
a{color:inherit}

h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.35;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.note{margin:0;font-size:15px}

function ensureLiveThreads(){
  if(DB_ON()) return 0;   // サーバー側で作るので、端末では作らない
  const today=days()[0];
  let added=0;
  // 同じ出演情報（複数グループが一緒に出るイベントなど）はひとつのスレッドにまとめる
  const seen=new Map();
  OFFICIAL.filter(o=>o.sched&&o.sched.d===0&&(o.cat==='media'||o.cat==='event')).forEach(o=>{
    const key=o.t.replace(/^【[^】]+】/,'').trim(); // 【メンバー名】を外した番組名で重複判定
    if(seen.has(key)){ const e=seen.get(key); if(o.g&&!e.gs.includes(o.g)) e.gs.push(o.g); }
    else seen.set(key,{o,gs:o.g?[o.g]:[]});
  });
  const live=[...seen.values()].slice(0,6).map(({o,gs})=>({...o,id:'lt-'+o.t.replace(/^【[^】]+】/,'').replace(/\W/g,'').slice(0,18),gs,
    t:o.t.replace(/^【[^】]+】/,'')}));
  const todayIds=new Set(live.map(o=>o.id));
  // 昨日までの実況スレは、書き込みがなければ片づける
  const before=S.threads.length;
  S.threads=S.threads.filter(t=>!t.live||todayIds.has(t.id)||t.res.length>1);
  live.forEach(o=>{
    const id=o.id;
    if(S.threads.some(t=>t.id===id)) return;
    S.threads.unshift({id,g:o.gs.length===1?o.gs[0]:null,gs:o.gs,cat:'実況',live:true,title:`【実況】${o.t}`,srcUrl:o.url,when:`${today.day}日 ${o.sched.time||''}`.trim(),count:1,upd:'自動で作成',
      res:[{n:1,nm:'広場の運営',id:'system',t:`このスレッドは出演情報から自動で立ちました。\n見ながらの実況・感想をどうぞ！\n\n※放送前の内容（ネタバレ）は伏せてください\n※チケットの売買・譲渡、メンバーのプライベートの話は禁止です`}]});
    added++;
  });
  if(added||before!==S.threads.length) save();
  return added;
}

// 送る前に正方形に切り取って400pxに縮小する（通信量を減らし、位置情報なども落とす）
function shrink(file){
  return new Promise((ok,ng)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const n=Math.min(img.width,img.height), c=document.createElement('canvas');
      c.width=c.height=400;
      const g=c.getContext('2d');
      g.imageSmoothingQuality='high';
      g.drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,400,400);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); ng(new Error('画像を読み取れませんでした')); };
    img.src=url;
  });
}

const notiSupported=()=>('Notification' in window)&&('serviceWorker' in navigator);

function b64ToU8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
// この端末を「通知の送り先」として登録する（アプリを閉じていても届くようにする）
async function subscribePush(){
  if(!window.VAPID_PUBLIC||!('PushManager' in window)) return false;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(window.VAPID_PUBLIC)});
    const res=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription:sub.toJSON(),follow:S.follow,noti:S.noti,token:getToken()||undefined})});
    S.pushOn=res.ok; save();
    return res.ok;
  }catch(e){ console.warn(e); return false; }
}
async function unsubscribePush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),unsubscribe:true})}); await sub.unsubscribe(); }
  }catch(e){}
  S.pushOn=false; save(); render(); toast('この端末への通知を止めました');
}

function maybeAskNoti(){

  let asked=0; try{ asked=+localStorage.getItem('noti-asked')||0; }catch(e){}
  if(asked>=2) return;                       // しつこく出さない（最大2回まで）
  const last=asked?+(localStorage.getItem('noti-asked-at')||0):0;

  setTimeout(()=>{

      <div class="actions"><button class="btn ghost sm" id="noti-later">あとで</button><button class="btn" id="noti-yes">通知をオンにする</button></div></div>`;
    try{ localStorage.setItem('noti-asked',String(asked+1)); localStorage.setItem('noti-asked-at',String(Date.now())); }catch(e){}

function visitCount(){
  try{
    if(!sessionStorage.getItem('visit-counted')){
      sessionStorage.setItem('visit-counted','1');
      localStorage.setItem('visits',String((+localStorage.getItem('visits')||0)+1));
    }
    return +localStorage.getItem('visits')||1;
  }catch(e){ return 1; }
}

function maybeAskInstall(){
  if(isStandalone()||inApp()) return;        // すでにアプリ／LINEなどの中のブラウザでは出さない
  let shown=0; try{ shown=+localStorage.getItem('install-asked')||0; }catch(e){}
  if(shown) return;                           // 大きい案内は1回きり（小さいバナーは残る）
  const first=visitCount()<2;

async function askNoti(){
  if(!notiSupported()) return toast('この環境では通知を使えません');
  const p=await Notification.requestPermission();
  render();
  if(p==='granted'){
    const ok=await subscribePush(); render();
    showLocalNoti('通知をオンにしました',ok?'推しの出演がある日は、実況スレが立ったらお知らせします':'この端末では、アプリを開いているときだけお知らせします');
    toast(ok?'通知をオンにしました（アプリを閉じていても届きます）':'通知をオンにしました');
  }
  else toast('通知はオフのままです');
}
async function showLocalNoti(title,body,url){
  try{
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'ebidan',data:{url:url||location.href}});
  }catch(e){ toast('通知を表示できませんでした'); }
}

V.e=(cid,eid)=>{
  const c=S.comms.find(x=>x.id===cid), e=c&&c.events.find(x=>x.id===eid); if(!e) return V.community();
  const k=cid+':'+eid, g=S.going.includes(k), n=e.joined+(c.remote?0:(g?1:0)), see=canSeeDetail(c), isHost=S.user&&e.host===S.user.name;
  let act='';
  if(isHost) act='<span class="chip ok">あなたが主催者です</span>';
  else if(!S.user) act='<button class="btn" id="login-open2">ログインして参加する</button>';
  else if(!see) act=`<a class="btn" href="#/c/${c.id}">まずコミュニティに参加する</a>`;
  else if(e.target==='10代限定'&&S.user.age!=='10代') act='<button class="btn" disabled>参加する</button><span class="lock">このイベントは10代限定です</span>';
  else if(e.target==='18歳以上'&&S.user.age==='10代') act='<button class="btn" disabled>参加する</button><span class="lock">安全のため、10代の方は「10代限定」のイベントのみ参加できます</span>';
  else if(g) act=`<span class="chip ok">参加予定</span><button class="btn sm ghost" data-go="${k}">参加を取り消す</button>`;
  else if(n>=e.cap) act='<button class="btn" disabled>満員です</button>';
  else act=`<button class="btn" data-go="${k}">参加する</button>`;
  return `<a class="back" href="#/c/${c.id}/events">← ${esc(c.name)}のイベント</a>
  <div class="page-h"><span class="meta"><span class="chip ${e.target==='10代限定'?'fan':'official'}">${esc(e.target)}</span>${esc(c.name)}</span><h1>${esc(e.t)}</h1></div>
  <dl class="panel info">
    <dt>日時</dt><dd class="time">${fmtDate(e.date,e.time)}〜</dd>
    <dt>場所</dt><dd>${see?esc(e.place)+`<br><span class="meta">${esc(e.area)}</span>`:esc(e.area)+' 周辺<br><span class="lock">お店の名前は、コミュニティの参加者にだけ表示されます</span>'}</dd>
    <dt>参加者</dt><dd>${n} / ${e.cap}人<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,n/e.cap*100)}%"></i></div></dd>
    <dt>主催</dt><dd>${esc(e.host)}</dd>
  </dl>
  ${e.desc?`<div class="panel compose"><p class="note" style="white-space:pre-wrap">${esc(e.desc)}</p></div>`:''}
  <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">${act}</div>
  <div class="notice">知らない人と会うときは、明るい時間に人の多いお店で。困ったことがあれば、すぐに運営へ通報してください。</div>`;
};

// 読み込みは直接、書き込みは推しトピアのAPI経由（NGワード・連投制限・IP記録のため）
const DB_ON = () => !!(window.SUPABASE_URL && window.SUPABASE_ANON);
function clientId(){
  let v=''; try{ v=localStorage.getItem('client-id')||''; }catch(e){}
  if(!v){ v=Math.random().toString(36).slice(2)+Date.now().toString(36); try{localStorage.setItem('client-id',v);}catch(e){} }
  return v;
}
// 返事が来ないまま待ち続けないように、時間を区切って打ち切る
async function fetchT(url,opts={},ms=12000){
  const c=new AbortController(), timer=setTimeout(()=>c.abort(),ms);
  try{ return await fetch(url,{...opts,signal:c.signal}); }
  catch(e){ throw new Error(e&&e.name==='AbortError'?'通信に時間がかかっています。電波のよいところでもう一度お試しください':'通信に失敗しました'); }
  finally{ clearTimeout(timer); }
}
async function dbGet(path){
  const r=await fetchT(`${window.SUPABASE_URL}/rest/v1/${path}`,
    {headers:{apikey:window.SUPABASE_ANON,Authorization:'Bearer '+window.SUPABASE_ANON}});
  if(!r.ok) throw new Error('db '+r.status);
  return r.json();
}

async function loadPosts(t){
  if(!t.remote) return;
  try{
    const rows=await dbGet(`posts?select=*&thread_id=eq.${t.dbId}&order=no.asc&limit=200`);
    const ids=rows.map(r=>r.id);
    let rx=[];
    if(ids.length) rx=await dbGet(`reactions?select=post_id,kind,client_id&post_id=in.(${ids.join(',')})`);
    S.reax=S.reax||{};
    for(const r of rows){
      const key='db'+r.id;
      const mine=rx.filter(x=>x.post_id===r.id&&x.client_id===clientId()).map(x=>x.kind);
      S.reax[key]=Object.fromEntries(['wakaru','suki','warota'].map(k=>[k,rx.filter(x=>x.post_id===r.id&&x.kind===k).length]));
      if(mine.length) S.myReax[key]=mine; else delete S.myReax[key];
    }
    t.res=rows.map(r=>({n:r.no,nm:r.author_name,id:r.anon_id||'',t:r.body,hidden:r.hidden,postId:r.id}));
    t.loaded=true;

  return m<1?'たった今':m<60?m+'分前':m<1440?Math.floor(m/60)+'時間前':Math.floor(m/1440)+'日前';
}

async function handleOAuthReturn(){
  const h=location.hash;
  // 推しトピア自身で処理したGoogleログインから戻ってきたとき
  if(h.startsWith('#/auth')){
    const q=new URLSearchParams(h.slice(h.indexOf('?')+1));
    history.replaceState(null,'',location.pathname+'#/me');
    if(q.get('t')){
      saveToken(q.get('t'));
      try{ const r=await apiAccount({action:'me',token:q.get('t')}); applyProfile(r.profile); S.inbox=null; render();
        toast(`おかえりなさい、${r.profile.handle}さん`); }catch(e){ toast(e.message); }
      return true;
    }
    if(q.get('new')){ ui.googleTicket=q.get('new');
      profileStep({google:'Google',apple:'Apple',x:'X'}[q.get('p')]||'連携ログイン'); return true; }
    return false;
  }
  if(!h.includes('access_token=')) return false;
  const params=new URLSearchParams(h.slice(h.indexOf('access_token=')));
  const at=params.get('access_token');
  history.replaceState(null,'',location.pathname+'#/me');
  if(!at) return false;
  try{
    const r=await apiAccount({action:'link',accessToken:at,token:getToken()||undefined});
    if(r.needsProfile){ ui.oauthToken=at; profileStep('連携ログイン'); return true; }
    saveToken(r.token); applyProfile(r.profile); S.inbox=null; render();
    toast(`おかえりなさい、${r.profile.handle}さん`);
    return true;
  }catch(e){ toast(e.message); return false; }
}

async function loadComms(){
  if(!DB_ON()) return;
  try{
    const [cs,evs,mem,emem]=await Promise.all([
      dbGet('communities?select=*,admin:profiles!communities_admin_id_fkey(handle)&order=member_count.desc&limit=100'),
      dbGet('events?select=*,host:profiles!events_host_id_fkey(handle)&order=date.asc&limit=200'),
      dbGet('community_members?select=community_id,user_id,status,profiles(handle,age_band,pref)&limit=1000'),
      dbGet('event_members?select=event_id,user_id&limit=1000'),
    ]);
    const my=S.user&&S.user.dbId||null;
    const joined=[],pending=[],going=[];
    const prof=m=>[m.profiles&&m.profiles.handle||'メンバー',m.profiles&&m.profiles.age_band||'—',m.profiles&&m.profiles.pref||'—',m.user_id];
    S.comms=cs.map(c=>{
      const id='c'+c.id, ms=mem.filter(m=>m.community_id===c.id), mine=!!(my&&c.admin_id===my);
      const me=my&&ms.find(m=>m.user_id===my);
      if(me&&!mine) (me.status==='approved'?joined:pending).push(id);
      const es=evs.filter(e=>e.community_id===c.id).map(e=>({
        id:'e'+e.id,dbId:e.id,t:e.title,date:e.date,time:(e.time||'').slice(0,5),place:e.place||'',area:e.area||'',
        cap:e.cap,joined:e.joined_count||0,target:e.target_band,host:e.host&&e.host.handle||'メンバー',desc:e.description||'',hostId:e.host_id}));
      es.forEach(e=>{ if(my&&emem.some(x=>x.event_id===e.dbId&&x.user_id===my)) going.push(id+':'+e.id); });
      return {id,dbId:c.id,remote:true,mine,g:c.group_id,name:c.name,kind:c.kind,members:c.member_count||0,
        only:c.only_band,join:c.join_type,admin:c.admin&&c.admin.handle||'運営',subs:[],
        created:(c.created_at||'').slice(0,10).replace(/-/g,'.'),desc:c.description||'',rules:c.rules||[],topics:[],events:es,
        sample:ms.filter(m=>m.status==='approved').map(prof),
        reqs:mine?ms.filter(m=>m.status==='pending').map(prof):[]};
    });
    S.joined=joined; S.pending=pending; S.going=going; save(); bgRender();
  }catch(e){ console.warn('コミュニティの読み込みに失敗',e); }
}

function downloadMembersCSV(){
  const cols=[['member_no','会員番号'],['handle','ハンドルネーム'],['age_band','年代'],['pref','都道府県'],['oshi','推しグループ'],
    ['birthday','誕生日'],['followers','フォロワー'],['following','フォロー中'],['posts','書き込み'],['comms','参加コミュニティ'],
    ['created_at','登録日時'],['last_seen','最終ログイン'],['banned','凍結'],['email','メールアドレス'],['bio','自己紹介']];
  const esc2=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows=[cols.map(c=>c[1]).join(',')];
  for(const u of ADMIN.users){
    rows.push(cols.map(([k])=>esc2(k==='banned'?(u.banned?'凍結中':''):k==='member_no'?fmtNo(u[k]):u[k])).join(','));
  }
  const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`推しトピア会員_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`${ADMIN.users.length}人ぶんを保存しました`);
}

function issueMemberNo(){

function loadQR(){
  if(window.QRCode) return Promise.resolve(true);
  if(loadQR._p) return loadQR._p;
  return loadQR._p = new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload=()=>res(true); sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}
async function drawQR(el, text){
  const ok = await loadQR();
  if(!ok || !el) { if(el) el.innerHTML='<p class="hint">QRコードを読み込めませんでした</p>'; return; }
  el.innerHTML='';
  const dark=getComputedStyle(document.body).getPropertyValue('--ink').trim()||'#1C1F3A';
  new QRCode(el,{text,width:200,height:200,colorDark:dark,colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
}

  return [...out.values()];
}

function toOfficial(items){
  const today=jstToday(), out=[];
  for(const it of items){
    const n=dayDiff(it.date,today);
    if(it.kind==='schedule'){
      if(n<0||n>6) continue;
      out.push({id:it.id,g:it.g,cat:it.cat,kind:'schedule',src:'official',label:it.label||'',via:'スケジュール · '+(it.label||'予定'),t:it.t,url:it.url,r:n+.5,ago:n===0?'今日':n===1?'明日':(n+'日後'),sched:{d:n,time:it.time||''}});
    } else {
      if(n<-14 && it.kind!=='video') continue;   // 動画は古くても見てもらう価値がある
      out.push({id:it.id,g:it.g,cat:it.cat,kind:it.kind,src:it.kind==='fan'?'fan':'official',
        likes:it.likes||0,
        via:it.kind==='video'?'公式動画':it.kind==='x'?`公式X · @${it.author}`:it.kind==='fan'?`話題の投稿 · @${it.author}`:'公式ニュース',
        kindLabel:it.kind,yt:it.yt||null,
        author:it.author,t:it.t||`@${it.author} の投稿`,url:it.url,r:-n,ago:relDate(it.date,today)});
    }
  }
  return out;
}

let embedObs=null;
// Xの表示部品は、最初のひとつが画面に入ったときにはじめて読み込む
let twLoading=null;
function needTwitter(){
  if(window.twttr&&twttr.widgets) return Promise.resolve();
  if(!twLoading) twLoading=new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://platform.twitter.com/widgets.js'; sc.async=true; sc.charset='utf-8';
    sc.onload=()=>res(); sc.onerror=()=>res();   // 読めなくても、元の投稿へのリンクは残る
    document.head.appendChild(sc);
  });
  return twLoading;
}
function loadEmbed(el){
  if(el.dataset.loaded) return;
  el.dataset.loaded='1';
  needTwitter().then(()=>{ try{ if(window.twttr&&twttr.widgets) twttr.widgets.load(el); }catch(e){} });
}
function watchEmbeds(){
  const tws=$('#app').querySelectorAll('.tw:not([data-loaded])');
  if(!tws.length) return;
  if(!('IntersectionObserver' in window)){ tws.forEach(loadEmbed); return; }
  if(!embedObs) embedObs=new IntersectionObserver(es=>{
    for(const en of es){ if(!en.isIntersecting) continue; embedObs.unobserve(en.target); loadEmbed(en.target); }
  },{rootMargin:'600px 0px'});
  tws.forEach(el=>embedObs.observe(el));
}

    const patch={handle:nm,bio:$('#pr-bio').value.trim(),age:$('#pr-age').value,pref:$('#pr-pref').value,
      oshi:$('#pr-oshi').value,birthday:(bm&&bd)?`${bm}-${bd}`:'',links};
    if(DB_ON()&&getToken()){
      apiAccount({action:'update',token:getToken(),...patch}).then(r=>{ applyProfile(r.profile); render(); toast('プロフィールを保存しました'); })
        .catch(e=>showErr('#pr-err',e.message));
      return;
    }
    Object.assign(S.user,{name:nm,bio:patch.bio,age:patch.age,pref:patch.pref,oshi:patch.oshi,birthday:patch.birthday,links});
    save(); render(); toast('プロフィールを保存しました');
  }
  else if(f.id==='reportform'){
    const reason=f.querySelector('[name="rp"]:checked').value;
    const note=$('#rp-note').value.trim();
    S.reports.push({target:f.dataset.target,reason,note,at:new Date().toISOString()});
    if(DB_ON()) apiBoard({action:'report',targetType:'post',targetId:f.dataset.target,reason,note,
      reporter:S.user?('#'+S.user.no):clientId()}).catch(()=>{});
    save(); $('#login').close(); toast('通報を受け付けました。運営が確認します');
  }
  else if(f.id==='adminlogin'){
    showErr('#adm-err','確認しています…');
    ADMIN.pass=$('#adm-pass').value;
    apiAdmin({action:'login'}).then(()=>{ S.adminOn=true; save(); location.hash='#/admin/home'; render(); toast('管理画面に入りました'); })
      .catch(e=>{ ADMIN.pass=''; showErr('#adm-err',e.message); });
  }
  else if(f.id==='adminusersearch'){ ui.adminQ=$('#adm-q').value; adminLoad('users'); }
  else if(f.id==='admuserform'){
    const id=f.dataset.id, nm=$('#au-name').value.trim(), msg=$('#au-msg').value.trim();
    const cur=ADMIN.users.find(x=>x.id===id), jobs=[];
    if(nm&&cur&&nm!==cur.handle) jobs.push(apiAdmin({action:'rename',userId:id,handle:nm}));
    if(msg) jobs.push(apiAdmin({action:'notice',userId:id,title:'運営からのメッセージ',body:msg}));
    Promise.all(jobs).then(()=>{ $('#login').close(); adminLoad('users'); toast('保存しました'+(msg?'（メッセージを送信）':'')); })
      .catch(e=>toast(e.message));
  }
  else if(f.id==='noticeform'){
    const title=$('#nt-title').value.trim(), body=$('#nt-body').value.trim();
    if(!title||!body) return showErr('#nt-err','件名と本文を入れてください');
    apiAdmin({action:'notice',title,body}).then(()=>{ $('#nt-title').value=''; $('#nt-body').value=''; toast('全員にお知らせを送信しました'); })
      .catch(e=>showErr('#nt-err',e.message));
  }
  else if(f.id==='adsform'){
    const v={enabled:$('#ad-on').checked,slot:$('#ad-slot').value,title:$('#ad-title').value.trim(),text:$('#ad-text').value.trim(),url:$('#ad-url').value.trim()};
    apiAdmin({action:'ads',value:v}).then(r=>{ ADMIN.ads=r.ads; S.ads=r.ads; save(); render(); toast('広告の設定を保存しました'); })
      .catch(e=>toast(e.message));
  }
  else if(f.id==='mailsend'){
    const em=$('#ml-email').value.trim();
    showErr('#ml-err','送信しています…');
    apiMail({action:'send',email:em}).then(()=>emailStep(em)).catch(e=>showErr('#ml-err',e.message));
  }
  else if(f.id==='mailverify'){
    const em=f.dataset.email, code=$('#ml-code').value.trim();
    showErr('#ml-err','確認しています…');
    apiMail({action:'verify',email:em,code}).then(r=>{
      if(r.needsProfile){ ui.googleTicket=r.ticket; profileStep('メール'); return; }
      saveToken(r.token); applyProfile(r.profile); S.inbox=null; $('#login').close(); render();
      toast(`おかえりなさい、${r.profile.handle}さん`);
    }).catch(e=>showErr('#ml-err',e.message));
  }
  else if(f.id==='nosearch'){
    const no=$('#no-q').value.replace(/[^0-9]/g,'');
    if(!no) return;
    if(DB_ON()){
      apiAccount({action:'find',memberNo:no}).then(r=>{
        ui.foundUser={name:r.profile.handle,no:r.profile.member_no,age:r.profile.age_band,pref:r.profile.pref,
          oshi:r.profile.oshi,bio:r.profile.bio,birthday:r.profile.birthday,avatar:r.profile.avatar,links:r.profile.links,g:null,dbId:r.profile.id};
        ui.missingUser=null;
        location.hash='#/u/'+no; render();
      }).catch(e=>toast(e.message));
      return;
    }
    location.hash='#/u/'+no;
  }
  else if(f.id==='comm-search'){ }
  else if(f.id==='evform'){
    const g=x=>$(x).value.trim();
    const ev={id:'e'+Date.now(),t:g('#ev-title'),date:g('#ev-date'),time:g('#ev-time'),place:g('#ev-place'),area:g('#ev-area'),cap:Math.max(2,Math.min(50,+g('#ev-cap')||10)),joined:0,target:g('#ev-target'),host:S.user.name,desc:g('#ev-desc')};
    if(!ev.t||!ev.date||!ev.place||!ev.area) return showErr('#ev-err','イベント名・日付・場所・エリアを入れてください');
    const bad=ng(ev.t+ev.desc); if(bad) return showErr('#ev-err',bad);
    const c=S.comms.find(x=>x.id===f.dataset.cid);
    if(c&&c.remote){
      apiComm({action:'createEvent',communityId:c.dbId,title:ev.t,date:ev.date,time:ev.time,place:ev.place,
        area:ev.area,cap:ev.cap,target:ev.target,description:ev.desc})
        .then(async r=>{ ui.evForm=false; await loadComms(); location.hash=`#/e/${c.id}/e${r.event.id}`; toast('イベントを公開しました'); })
        .catch(e=>showErr('#ev-err',e.message));
      return;
    }
    c.events.push(ev); c.events.sort((a,b)=>a.date.localeCompare(b.date));
    S.going.push(c.id+':'+ev.id); ui.evForm=false; save(); location.hash=`#/e/${c.id}/${ev.id}`; toast('イベントを公開しました');
  }
  else if(f.id==='commform'){
    const name=$('#cm-name').value.trim(), desc=$('#cm-desc').value.trim();
    if(!name) return showErr('#cm-err','コミュニティ名を入れてください');
    const bad=ng(name+desc); if(bad) return showErr('#cm-err',bad);
    const only={'10代のみ':'10代','18歳以上のみ':'18歳以上'}[$('#cm-only').value]||null;
    const join=f.querySelector('[name="cm-join"]:checked').value;
    const rules=$('#cm-rules').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(DB_ON()){
      apiComm({action:'create',name,groupId:$('#cm-g').value||null,kind:$('#cm-kind').value,description:desc,
        rules,joinType:join,onlyBand:only})
        .then(async r=>{ await loadComms(); location.hash='#/c/c'+r.community.id; toast('コミュニティをつくりました'); })
        .catch(e=>showErr('#cm-err',e.message));
      return;
    }
    const a=only==='10代'?['10代','10代']:only?['20代','30代']:['10代','40代'];
    const now=new Date();
    const c={id:'c'+Date.now(),mine:true,g:$('#cm-g').value||null,name,kind:$('#cm-kind').value,members:1,only,join,admin:S.user.name,subs:[],created:`${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`,
      desc:desc||'（説明はまだありません）',rules:$('#cm-rules').value.split('\n').map(x=>x.trim()).filter(Boolean),topics:[{t:'自己紹介トピック',n:0,upd:'—'}],events:[],
      sample:[[S.user.name,S.user.age,S.user.pref]],reqs:join==='承認制'?[['ゆずみるく',a[0],'東京都'],['いちごみるく',a[1],'千葉県']]:[]};
    S.comms.unshift(c); save(); location.hash='#/c/'+c.id; toast(join==='承認制'?'コミュニティをつくりました。デモ用に参加申請が2件届いています':'コミュニティをつくりました');
  }
  else if(f.id==='threadform'){
    const title=$('#th-title').value.trim(), body=$('#th-body').value.trim();
    if(!title||!body) return showErr('#th-err','タイトルと最初の書き込みを入れてください');
    const bad=ng(title+body); if(bad) return showErr('#th-err',bad);
    if(DB_ON()){
      ui.newThread=false;
      apiBoard({action:'thread',groupId:$('#th-g').value||null,cat:$('#th-cat').value,title,body,name:who(),anonId:anonId()})
        .then(async r=>{ await loadThreads(); location.hash='#/thread/db'+r.thread.id; toast('スレッドを立てました'); })
        .catch(e=>{ ui.newThread=true; render(); showErr('#th-err',e.message); });
      return;
    }
    const id='t'+Date.now();
    S.threads.unshift({id,g:$('#th-g').value||null,cat:$('#th-cat').value,title,count:1,upd:'たった今',res:[{n:1,nm:who(),id:S.user?Math.random().toString(36).slice(2,7):anonId(),t:body}]});
    ui.newThread=false; save(); location.hash='#/thread/'+id;
  }
});
safeRender();
loadLive();
loadThreads();
loadSettings();
loadComms();
handleOAuthReturn().then(done=>{ if(!done) restoreAccount(); });
maybeAskNoti();
maybeAskInstall();
// ホーム画面アプリとして動かすための登録（マニフェストがあるときだけ）
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>

</html>
